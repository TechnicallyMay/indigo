{{ template "base" . }}

{{ define "header" }}
<div id="main-header" hx-swap-oob="outerHTML" class="flex-row full-width space-between flex-center">
    <h4>Billing - (Batch {{ .Batch.Id }}) - {{ .Batch.State.String }}</h4>

    <div class="flex-row gap-sm">
        <button type="button" class="secondary" hx-get="/billing/{{ .Batch.Id }}" hx-target="#main-content" hx-push-url="true">Back</button>
        {{ if eq .Batch.State.String "Draft" }}
        <button type="button" hx-confirm="Send notifications?" hx-post="/billing/send/{{ .Batch.Id }}">Send</button>
        {{ end }}
    </div>
</div>
{{ end }}

{{ define "content" }}

<div class="widget">

    <hgroup>
        <h5>{{ .Batch.NotificationSubject }}</h5>
        <p>{{ .Batch.NotificationDescription }}</p>
    </hgroup>

</div>

{{ end }}
