{{ template "base" . }}

{{ define "content" }}
<h1>
    New Billing!
</h1>

<table>
    <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">First Name</th>
            <th scope="col">Last Name</th>
            <th scope="col">Email</th>
        </tr>
    </thead>
    <tbody>
        {{ range . }}
        <tr id="customer-table-{{ .Id }}">
            <td>{{ .FirstName }}</td>
            <td>{{ .LastName }}</td>
            <td>{{ .Email }}</td>
            <td></td>
            <td>
                <a href="/customers/new/{{ .Id }}" hx-target="#customer-table-{{ .Id }}" hx-swap="outerHTML" hx-replace-url="false">Edit</a>
            </td>
        </tr>
        {{ end }}
    </tbody>
</table>

{{ end }}
