{{ define "invoiceItem" }}

<tr>
    <td>
        <form
                id="product-form-{{ .InvoiceItem.InvoiceId }}-{{ .InvoiceItem.ProductId }}"
                hx-put="/invoiceItem/{{ .InvoiceItem.InvoiceId }}/{{ .InvoiceItem.ProductId }}">
            <input type="hidden" name="invoiceId" value="{{ .InvoiceItem.InvoiceId }}" />
            <input type="hidden" name="productId" value="{{ .InvoiceItem.ProductId }}" />
            <div>{{ .Product.Name }}</div>
        </form>
    </td>
    <td>${{ .Product.UnitPrice }}</td>
    <td>
        <div class="flex-row flex-center">
            <strong>x</strong>
            <input type="number" value="{{ .InvoiceItem.Quantity }}" required></input>
        </div>
    </td>
</tr>

{{ end }}
