{{ template "base" . }}

{{ define "content" }}
<h1>
    Customers!
</h1>

<table>
    <thead>
        <tr>
            <th scope="col">First Name</th>
            <th scope="col">Last Name</th>
            <th scope="col">Email</th>
        </tr>
    </thead>
    <tbody>
        {{ range . }}
        <tr>
            <td>{{ .FirstName }}</td>
            <td>{{ .LastName }}</td>
            <td>{{ .Email }}</td>
        </tr>
        {{ end }}
    </tbody>
</table>

<a href="/customers/new" hx-target="#main-content">New Customer</a>
{{ end }}
