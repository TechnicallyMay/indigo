{{ template "base" . }}

{{ define "header" }}
<div id="main-header" hx-swap-oob="true" class="flex-row full-width space-between flex-center">
     <h4>Customers</h4>
     <button
        type="button"
        hx-get="/customers/new"
        hx-target="#customer-table tbody"
        hx-swap="afterend"
        hx-replace-url="false">
        New Customer
    </button>
</div>
{{ end }}

{{ define "content" }}
<div class="scroll-container widget">
    <table id="customer-table">
        <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Email</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            {{ range . }}
            <tr id="customer-table-{{ .Id }}">
                <td>{{ .Id }}</td>
                <td>{{ .FirstName }}</td>
                <td>{{ .LastName }}</td>
                <td>{{ .Email }}</td>
                <td>
                    <a href="/customers/edit/{{ .Id }}" hx-target="#customer-table-{{ .Id }}" hx-swap="outerHTML" hx-replace-url="false">Edit</a>
                </td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</div>
{{ end }}
